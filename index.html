<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8a8f">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Places in My City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: phone-first single lesson flow — top progress bar, one exercise, bottom action sheet */
:root{
  --bg:#ffffff; --ink:#1f3540; --muted:#6c8088; --line:#dfe8e7; --tile:#f5f9f8;
  --accent:#1f8a8f; --accent-d:#15666a; --ok:#48b85a; --ok-d:#358a43; --ok-bg:#e3f6e5;
  --bad:#e5534b; --bad-d:#b23a33; --bad-bg:#fde7e5; --sun:#f4a72c;
  --font:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12202a; --ink:#e6f0ef; --muted:#93a9b0; --line:#2b3f4a; --tile:#1a2c37;
  --accent:#3fb7bb; --accent-d:#2a8a8d; --ok:#5ccb6c; --ok-d:#3f9a4c; --ok-bg:#183a24;
  --bad:#f0726a; --bad-d:#b9483f; --bad-bg:#3d1f1f; --sun:#f7b84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12202a; --ink:#e6f0ef; --muted:#93a9b0; --line:#2b3f4a; --tile:#1a2c37;
  --accent:#3fb7bb; --accent-d:#2a8a8d; --ok:#5ccb6c; --ok-d:#3f9a4c; --ok-bg:#183a24;
  --bad:#f0726a; --bad-d:#b9483f; --bad-bg:#3d1f1f; --sun:#f7b84a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;font-weight:600;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 0}

/* top */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.x{background:none;border:none;font-size:26px;color:var(--muted);padding:0 4px;line-height:1}
.pbar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s}
.hearts{font-weight:900;color:var(--bad);font-variant-numeric:tabular-nums;white-space:nowrap}

.main{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:170px}
.kind{font-size:22px;font-weight:900}
.tag{display:inline-block;background:var(--sun);color:#3a2600;font-size:13px;font-weight:900;border-radius:8px;padding:2px 8px;letter-spacing:.05em;text-transform:uppercase}
.big{font-size:clamp(30px,9vw,42px);font-weight:900;line-height:1.1;text-wrap:balance}
.muted{color:var(--muted)}
.pron{color:var(--muted);font-style:italic;font-weight:600}

.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;font-weight:800;font-size:18px}
.opt:active{transform:translateY(2px)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-d)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-d)}
.opt.sel{border-color:var(--accent);background:var(--tile)}
.opt.gone{opacity:.2;pointer-events:none}
.opt:disabled{cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{text-align:center;font-size:16px;padding:14px 8px;min-width:0;overflow-wrap:anywhere}

.spk{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;background:var(--accent);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;box-shadow:0 4px 0 var(--accent-d)}
.spk svg{width:22px;height:22px}
.spk.huge{width:110px;height:110px;border-radius:28px}
.spk.huge svg{width:48px;height:48px}
.spk.slow{background:var(--tile);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

.newcard{border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.newcard .uz{font-size:24px;font-weight:900;color:var(--accent)}
.newcard .ex{background:var(--tile);border-radius:12px;padding:10px 14px;width:100%}
.ex small{display:block;color:var(--muted);font-weight:600}

input.type{width:100%;font:inherit;font-size:22px;font-weight:800;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--tile);color:var(--ink)}
.gapline{font-size:22px;font-weight:800;line-height:1.6}
.gapline u{text-decoration:none;display:inline-block;min-width:90px;border-bottom:3px solid var(--sun);margin:0 4px}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
.sheet.ok{background:var(--ok-bg);border-color:transparent}
.sheet.no{background:var(--bad-bg);border-color:transparent}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:22px;font-weight:900}
.sheet.ok h3{color:var(--ok-d)} .sheet.no h3{color:var(--bad-d)}
.sheet p{margin:0}
.cta{width:100%;border:none;border-radius:16px;padding:15px;font-weight:900;font-size:18px;letter-spacing:.04em;text-transform:uppercase;background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ok-d)}
.cta.red{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.cta.grey{background:var(--line);color:var(--muted);box-shadow:none}
.cta.alt{background:var(--bg);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* home */
.home{flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center;text-align:center;padding-block:20px 40px}
.home h1{margin:0;font-size:clamp(34px,10vw,48px);font-weight:900;line-height:1.05}
.ring{width:150px;height:150px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}
.ring b small{font-size:13px;color:var(--muted);font-weight:700}
.hstats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.hstats span{border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.toggle{background:none;border:none;color:var(--muted);text-decoration:underline;font-weight:700}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
const RAW=[
["hospital","haaspitel","shifoxona","The hospital is nearby.","Shifoxona yaqinda.","hospital"],
["university","yuuneverseti","universitet","She studies at university.","U universitetda o‘qiydi.","university"],
["library","laybrerii","kutubxona","I borrow books from the library.","Men kutubxonadan kitob olaman.","library"],
["museum","myuziiem","muzey","We visited the museum.","Biz muzeyga bordik.","museum"],
["cinema","sineme","kinoteatr","Let's go to the cinema.","Kinoga boraylik.","cinema"],
["theatre","thiieter","teatr","There is a theatre downtown.","Shahar markazida teatr bor.","theatre"],
["restaurant","resteraant","restoran","We had dinner at a restaurant.","Biz restoranda kechki ovqat qildik.","restaurant"],
["café","kafey","kafe","I meet friends at a café.","Men do‘stlarim bilan kafeda uchrashaman.","café"],
["supermarket","suupermaarkit","supermarket","I buy food at the supermarket.","Men supermarketdan oziq-ovqat olaman.","supermarket"],
["market","maarket","bozor","My mother goes to the market.","Onam bozorga boradi.","market"],
["bank","bangk","bank","The bank is next to the café.","Bank kafening yonida.","bank"],
["pharmacy","faarmesi","dorixona","I bought medicine at the pharmacy.","Men dorixonadan dori sotib oldim.","pharmacy"],
["station","steyshen","bekat / vokzal","The train station is far away.","Vokzal uzoqda.","station"],
["airport","erport","aeroport","We went to the airport.","Biz aeroportga bordik.","airport"],
["go to the cinema","gou tu dhe sineme","kinoga bormoq","We go to the cinema on Friday.","Biz juma kuni kinoga boramiz.","go to the cinema"],
["visit a museum","vizit e myuziiem","muzeyga tashrif buyurmoq","I visit museums when I travel.","Sayohat qilganimda muzeylarga boraman.","visit museums"],
["borrow a book","baarou e buk","kitob olmoq (vaqtincha)","I borrowed a book from the library.","Men kutubxonadan kitob oldim.","borrowed a book"],
["buy groceries","bay grouseriz","oziq-ovqat xarid qilmoq","I buy groceries every week.","Men har hafta oziq-ovqat xarid qilaman.","buy groceries"],
["go to the market","gou tu dhe maarket","bozorga bormoq","We go to the market on Sunday.","Biz yakshanba kuni bozorga boramiz.","go to the market"],
["meet at a café","miit at e kafey","kafeda uchrashmoq","We meet at a café.","Biz kafeda uchrashamiz.","meet at a café"],
["wait for a bus","weyt for e bas","avtobus kutmoq","I wait for the bus here.","Men avtobusni shu yerda kutaman.","wait for the bus"],
["find a place","faynd e pleys","joy topmoq","We found a quiet place.","Biz tinch joy topdik.","found"],
["enter","enter","kirmoq","Please enter the building.","Iltimos, binoga kiring.","enter"],
["leave","liiv","chiqib ketmoq","We left the museum at five.","Biz muzeydan soat beshda chiqdik.","left"],
["public","pablik","jamoatga oid","It is a public library.","Bu jamoat kutubxonasi.","public"],
["private","prayvet","xususiy","It is a private hospital.","Bu xususiy shifoxona.","private"],
["local","loukel","mahalliy","I like local restaurants.","Menga mahalliy restoranlar yoqadi.","local"],
["central","sentrel","markaziy","It is in a central area.","U markaziy hududda.","central"],
["nearby","nirbay","yaqin(da)","There is a pharmacy nearby.","Yaqin atrofda dorixona bor.","nearby"],
["expensive","ikspensiv","qimmat","Restaurants here are expensive.","Bu yerdagi restoranlar qimmat.","expensive"],
["cheap","chiip","arzon","This market is cheap.","Bu bozor arzon.","cheap"],
["interesting","intresting","qiziqarli","The museum is interesting.","Muzey qiziqarli.","interesting"],
["boring","boring","zerikarli","The place is boring.","Bu joy zerikarli.","boring"],
["popular","paapyeler","mashhur","This café is popular.","Bu kafe mashhur.","popular"],
["on the outskirts of","on dhi autskerts ov","…ning chekka qismida","They live on the outskirts of the city.","Ular shaharning chekkasida yashaydi.","on the outskirts of"],
["in the city centre","in dhe siti senter","shahar markazida","There are many shops in the city centre.","Shahar markazida ko‘p do‘konlar bor.","in the city centre"],
["within walking distance","widhin woking distens","piyoda boriladigan masofada","The supermarket is within walking distance.","Supermarketga piyoda borsa bo‘ladi.","within walking distance"],
["around the corner","eraund dhe korner","juda yaqin, burchak ortida","There's a café around the corner.","Burchak ortida kafe bor.","around the corner"],
["next door to","nekst dor tu","yonidagi binoda","The pharmacy is next door to the bank.","Dorixona bankning yonidagi binoda.","next door to"],
["opposite the station","opezit dhe steyshen","vokzal ro‘parasida","The café is opposite the station.","Kafe vokzal ro‘parasida.","opposite the station"]];
const W=RAW.map((a,i)=>({id:i,en:a[0],pr:a[1],uz:a[2],ex:a[3],exUz:a[4],gap:a[5]}));
const ALT={"theatre":["theater"],"in the city centre":["in the city center"],"café":["cafe"],"meet at a café":["meet at a cafe"]};

/* state: score 0..5 per word (-1 = not introduced yet) */
let S={xp:0,m:{},slow:false,lessons:0};
try{const s=JSON.parse(localStorage.getItem("pimc2")||"null");if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem("pimc2",JSON.stringify(S))}catch(e){}};
const sc=w=>S.m[w.id]===undefined?-1:S.m[w.id];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=(slow||S.slow)?0.65:0.92;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){say(b.dataset.say,b.dataset.slow==="1")}});
const spk=(t,label,slow)=>`<button class="spk${slow?" slow":""}" data-say="${esc(t)}"${slow?' data-slow="1"':""}>${ICON}${label?`<span>${label}</span>`:""}</button>`;

/* ---------------- HOME ---------------- */
function home(){
  try{speechSynthesis.cancel()}catch(e){}
  const learned=W.filter(w=>sc(w)>=3).length, seen=W.filter(w=>sc(w)>=0).length;
  const C=2*Math.PI*64, off=C*(1-learned/40);
  $("#app").innerHTML=`<div class="home">
    <div class="muted" style="font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px">Lesson 9 · 40 so‘z</div>
    <h1>Places in My City</h1>
    <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="75" cy="75" r="64" fill="none" stroke="var(--ok)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${learned}<small>/ 40 yodlandi</small></b></div>
    <div class="hstats"><span>XP ${S.xp}</span><span>Ko‘rilgan ${seen}/40</span><span>Darslar ${S.lessons}</span></div>
    <button class="cta" id="start" style="font-size:20px;padding:18px">${S.lessons?"Davom etish":"Boshlash"}</button>
    <p class="muted" style="margin:0">Har dars 3–4 daqiqa: yangi so‘zlar + tinglash, tanlash, juftlash, yozish, gapirish — hammasi aralash. Xato qilganingiz qaytib keladi.</p>
    <div><button class="toggle" id="slow">Ovoz tezligi: ${S.slow?"sekin":"normal"}</button> · <button class="toggle" id="reset">Boshidan</button></div>
  </div>`;
  $("#start").onclick=startLesson;
  $("#slow").onclick=()=>{S.slow=!S.slow;save();home()};
  $("#reset").onclick=e=>{if(e.target.dataset.c){S={xp:0,m:{},slow:S.slow,lessons:0};save();home()}else{e.target.dataset.c=1;e.target.textContent="Ishonchingiz komilmi? Yana bosing"}};
}

/* ---------------- LESSON ENGINE ---------------- */
const STEPS=16;
let L;
function startLesson(){
  // working set: up to 4 new words + words in progress + some review
  const news=W.filter(w=>sc(w)<0).slice(0,4);
  const learning=shuf(W.filter(w=>sc(w)>=0&&sc(w)<3)).slice(0,6);
  const review=shuf(W.filter(w=>sc(w)>=3)).slice(0,3);
  L={step:0,news:news.slice(),pool:[...learning,...review],retry:[],right:0,wrong:0,last:null,matchAt:new Set([6,13])};
  next();
}
function bump(w,ok){
  const v=sc(w)<0?0:sc(w);
  S.m[w.id]=Math.max(0,Math.min(5,v+(ok?1:-1)));
  if(ok){S.xp+=10;L.right++}else{L.wrong++;L.retry.push({w,at:L.step+3})}
  save();
}
function pickWord(){
  const due=L.retry.findIndex(r=>r.at<=L.step);
  if(due>=0)return L.retry.splice(due,1)[0].w;
  const c=L.pool.filter(w=>w!==L.last);const arr=c.length?c:L.pool;
  let tot=0;const ws=arr.map(w=>{const v=1/(1+Math.max(0,sc(w))*1.4);tot+=v;return v});
  let r=Math.random()*tot;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i]}return arr[0];
}
function next(){
  if(L.step>=STEPS)return finish();
  L.step++;
  const total=STEPS;
  // introduce new word every 3rd step while any remain (and always first step)
  if(L.news.length&&(L.step===1||L.step%3===1)){const w=L.news.shift();L.pool.push(w);return ex.intro(w)}
  if(L.matchAt.has(L.step)&&L.pool.length>=4)return ex.match();
  if(!L.pool.length){const w=L.news.shift()||W[0];L.pool.push(w);return ex.intro(w)}
  const w=pickWord();L.last=w;const s=Math.max(0,sc(w));
  const types=s<=0?["listen","en2uz","listen"]:s===1?["uz2en","listen","gap","en2uz"]:s===2?["gap","type","uz2en","speak","listenType"]:["type","speak","listenType","gap"];
  ex[types[Math.random()*types.length|0]](w);
}
function frame(inner){
  $("#app").innerHTML=`<div class="top"><button class="x" id="quit" aria-label="Chiqish">✕</button><div class="pbar"><i id="pb"></i></div><div class="hearts">${L.right}✓</div></div><div class="main">${inner}</div><div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>`;
  requestAnimationFrame(()=>{$("#pb").style.width=((L.step-1)/STEPS*100)+"%"});
  $("#quit").onclick=home;
}
function sheetBtn(label,cls,fn){
  const s=$("#sheet");s.className="sheet";$("#sheetIn").innerHTML=`<button class="cta ${cls||""}" id="cta">${label}</button>`;$("#cta").onclick=fn;return $("#cta");
}
function result(ok,w,note){
  const s=$("#sheet");s.className="sheet "+(ok?"ok":"no");
  $("#sheetIn").innerHTML=`<div><h3>${ok?["Zo‘r!","Barakalla!","To‘g‘ri!","Ajoyib!"][Math.random()*4|0]:"To‘g‘ri javob:"}</h3>
    <p><b>${esc(w.en)}</b> — ${esc(w.uz)}</p>${note?`<p class="muted" style="font-size:15px">${note}</p>`:""}</div>
    <button class="cta ${ok?"":"red"}" id="cta">Davom etish</button>`;
  $("#cta").onclick=next;$("#cta").focus();say(w.en);
}
function distract(w,n){return shuf([w,...shuf(W.filter(x=>x!==w)).slice(0,n)])}
function choice({w,kind,prompt,choices,label,note}){
  frame(`<div class="kind">${kind}</div>${prompt}<div class="opts">${choices.map((c,i)=>`<button class="opt" data-i="${i}">${esc(label(c))}</button>`).join("")}</div>`);
  sheetBtn("Javobni tanlang","grey",()=>{});
  let done=false;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done)return;done=true;const ok=choices[+b.dataset.i]===w;
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(choices[+x.dataset.i]===w)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    bump(w,ok);result(ok,w,note);
  });
}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’‘`]/g,"'").replace(/[.!?,]/g,"").replace(/\s+/g," ").trim();

const ex={
 intro(w){
   frame(`<div><span class="tag">Yangi so‘z</span></div>
   <div class="newcard"><div class="big">${esc(w.en)}</div><div class="pron">[${esc(w.pr)}]</div>
     <div class="row center">${spk(w.en,"Tinglash")}${spk(w.en,"Sekin",true)}</div>
     <div class="uz">${esc(w.uz)}</div>
     <div class="ex">${esc(w.ex)}<small>${esc(w.exUz)}</small></div>
     ${spk(w.ex,"Gapni tinglash",true)}</div>
   <p class="muted" style="margin:0;text-align:center">Ovoz chiqarib 2 marta takrorlang 🗣</p>`);
   say(w.en);
   sheetBtn("Tushundim","",()=>{if(sc(w)<0){S.m[w.id]=0;save()}next()});
 },
 en2uz(w){choice({w,kind:"Tarjimasini tanlang",prompt:`<div class="row">${spk(w.en)}<div class="big">${esc(w.en)}</div></div>`,choices:distract(w,3),label:c=>c.uz});setTimeout(()=>say(w.en),100)},
 uz2en(w){choice({w,kind:"Inglizchasini tanlang",prompt:`<div class="big">${esc(w.uz)}</div>`,choices:distract(w,3),label:c=>c.en})},
 listen(w){
   choice({w,kind:"Nimani eshitdingiz?",prompt:`<div class="row center">${spk(w.en).replace('class="spk"','class="spk huge"')}${spk(w.en,"",true)}</div>`,choices:distract(w,3),label:c=>c.uz});
   setTimeout(()=>say(w.en),150);
 },
 gap(w){
   const parts=w.ex.split(w.gap);
   const opts=distract(w,3);
   choice({w,kind:"Gapni to‘ldiring",prompt:`<div class="gapline">${esc(parts[0])}<u></u>${esc(parts.slice(1).join(w.gap))}</div><div class="muted">${esc(w.exUz)}</div>`,choices:opts,label:c=>c.gap,note:esc(w.ex)});
 },
 type(w,listenMode){
   frame(`<div class="kind">${listenMode?"Eshitganingizni yozing":"Inglizcha yozing"}</div>
     ${listenMode?`<div class="row center">${spk(w.en).replace('class="spk"','class="spk huge"')}${spk(w.en,"",true)}</div>`:`<div class="big">${esc(w.uz)}</div><div class="muted">${esc(w.exUz)}</div>`}
     <input class="type" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Inglizcha yozing…" aria-label="Javob">
     <button class="toggle" id="hint" style="align-self:flex-start">Birinchi harfni ko‘rsat</button>`);
   if(listenMode)setTimeout(()=>say(w.en),150);
   const inp=$("#ans");setTimeout(()=>inp.focus(),50);let hinted=false;
   $("#hint").onclick=()=>{hinted=true;inp.value=w.en[0];inp.focus()};
   const check=()=>{const v=norm(inp.value);if(!v){inp.classList.add("shake");setTimeout(()=>inp.classList.remove("shake"),300);return}
     inp.disabled=true;const ok=[w.en,...(ALT[w.en]||[])].some(a=>norm(a)===v);bump(w,ok);result(ok,w,ok?esc(w.ex):"Siz yozdingiz: "+esc(inp.value))};
   sheetBtn("Tekshirish","",check);
   inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(!inp.disabled)check()}};
 },
 listenType(w){ex.type(w,true)},
 speak(w){
   frame(`<div class="kind">Inglizcha ovoz chiqarib ayting 🗣</div><div class="big">${esc(w.uz)}</div><div class="muted" style="font-size:19px">“${esc(w.exUz)}”</div>
     <div id="rev"></div>`);
   sheetBtn("Aytdim — tekshirish","",()=>{
     say(w.en);
     $("#rev").innerHTML=`<div class="newcard"><div class="big" style="font-size:30px">${esc(w.en)}</div><div class="ex">${esc(w.ex)}</div><div class="row center">${spk(w.en,"So‘z")}${spk(w.ex,"Gap",true)}</div></div>`;
     const s=$("#sheet");s.className="sheet";
     $("#sheetIn").innerHTML=`<p style="text-align:center;margin:0">To‘g‘ri aytdingizmi?</p><div class="two"><button class="cta red" id="no">Yo‘q</button><button class="cta" id="yes">Ha</button></div>`;
     $("#yes").onclick=()=>{bump(w,true);next()};$("#no").onclick=()=>{bump(w,false);next()};
   });
 },
 match(){
   const ws=shuf(L.pool).slice(0,Math.min(5,L.pool.length));
   const A=shuf(ws),B=shuf(ws);let sel=null,left=ws.length;
   frame(`<div class="kind">Juftlarini toping</div><div class="grid2">${A.map((w,i)=>`<button class="opt" data-s="A" data-id="${w.id}">${esc(w.en)}</button><button class="opt" data-s="B" data-id="${B[i].id}">${esc(B[i].uz)}</button>`).join("")}</div>`);
   sheetBtn("Juftlang","grey",()=>{});
   document.querySelectorAll(".grid2 .opt").forEach(b=>b.onclick=()=>{
     if(b.dataset.s==="A")say(W[b.dataset.id].en);
     if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
     const a=sel;sel=null;
     if(a.dataset.id===b.dataset.id){[a,b].forEach(x=>{x.classList.remove("sel");x.classList.add("right");setTimeout(()=>x.classList.add("gone"),250)});S.xp+=5;save();
       if(--left===0){L.right++;const s=$("#sheet");s.className="sheet ok";$("#sheetIn").innerHTML=`<h3>Hammasi to‘g‘ri!</h3><button class="cta" id="cta">Davom etish</button>`;$("#cta").onclick=next}}
     else{const w=W[a.dataset.s==="A"?a.dataset.id:b.dataset.id];S.m[w.id]=Math.max(0,sc(w)-1);L.retry.push({w,at:L.step+2});save();
       [a,b].forEach(x=>x.classList.add("wrong","shake"));setTimeout(()=>[a,b].forEach(x=>x.classList.remove("wrong","shake","sel")),450)}
   });
 }
};
function finish(){
  S.lessons++;save();
  const acc=Math.round(L.right/Math.max(1,L.right+L.wrong)*100);
  const learned=W.filter(w=>sc(w)>=3).length;
  $("#app").innerHTML=`<div class="home"><div class="big">Dars tugadi! 🎉</div>
    <div class="hstats"><span>Aniqlik ${acc}%</span><span>To‘g‘ri ${L.right}</span><span>Yodlangan ${learned}/40</span></div>
    <button class="cta" id="again" style="padding:18px;font-size:20px">Keyingi dars</button>
    <button class="cta alt" id="h">Bosh sahifa</button></div>`;
  $("#again").onclick=startLesson;$("#h").onclick=home;$("#again").focus();
}
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!["INPUT","BUTTON"].includes(document.activeElement?.tagName)){const c=$("#cta");if(c&&!c.classList.contains("grey")){e.preventDefault();c.click()}}
  const n=+e.key;if(n>=1&&n<=4&&document.activeElement?.tagName!=="INPUT"){const o=document.querySelectorAll(".opts .opt")[n-1];if(o&&!o.disabled)o.click()}
});
home();
</script>
</body>
</html>
